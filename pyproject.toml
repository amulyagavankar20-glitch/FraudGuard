[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard"
version = "1.0.0"
description = "IEEE-CIS fraud detection research prototype trained through a canonical Kaggle notebook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4",
  "lightgbm>=4.3", "joblib>=1.3", "fastapi>=0.110",
  "uvicorn>=0.29", "pydantic>=2.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
